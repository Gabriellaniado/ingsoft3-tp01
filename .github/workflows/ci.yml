name: CI

on:
  pull_request:
    branches: [main]      # ← el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # ← sólo para que main tenga su corrida (la que lee el badge, §3.5)

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend          # ajustá a donde esté TU Dockerfile
          push: false                 # todavía no publicamos la imagen en ningún lado
          tags: backend:ci            # el nombre de la imagen (hoy sólo vive dentro del runner)
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      
      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./app/backend
          target: test          # ← se detiene en la etapa de tests, no llega a final
          load: true            # ← deja la imagen en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test
      
      - name: Correr tests, verificar umbral y generar reporte (dentro del contenedor)
        run: |
          mkdir -p TestResults
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Escribir resumen de coverage en el Step Summary
        if: ${{ !cancelled() }}
        run: |
          echo "## 📊 Coverage Report — Backend (Go)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat TestResults/coverage-func.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Publicar reporte de coverage
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report-backend
          path: TestResults/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./app/frontend
          push: false
          tags: frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

