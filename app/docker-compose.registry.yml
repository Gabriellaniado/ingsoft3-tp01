services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U turnero_user -d turnero_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Imagen publicada por el pipeline (etiqueta sha-<commit>, sin "latest"). Para actualizarla,
    # cambiar el SHA por el de un commit de main cuyo pipeline ya la haya publicado.
    image: ghcr.io/gabriellaniado/ingsoft3-tp01-backend:sha-8076cacd092c4310aef2f6bd45374a066912b7fd
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/gabriellaniado/ingsoft3-tp01-frontend:sha-8076cacd092c4310aef2f6bd45374a066912b7fd
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
