server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: cualquier ruta que no sea un archivo real
    # se sirve como index.html y el router de React lo maneja.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend por la red interna de compose.
    # Usamos el resolver de Docker (127.0.0.11) y una variable para el
    # proxy_pass: con el nombre directo, nginx lo resuelve AL ARRANCAR y,
    # si el backend todavía no existe, nginx rechaza levantar.
    # Con variable, resuelve recién cuando llega un pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    location /api/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
